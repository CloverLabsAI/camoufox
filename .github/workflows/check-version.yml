name: Check Firefox Upstream Version

on:
  schedule:
    - cron: '0 8 * * *'   # каждый день в 08:00 UTC
  workflow_dispatch:        # ручной запуск

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read current version from upstream.sh
        id: current
        run: |
          source upstream.sh
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "release=$release"   >> "$GITHUB_OUTPUT"

      - name: Fetch latest Firefox versions from Mozilla
        id: latest
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          DETAILS=$(curl -fsSL "https://product-details.mozilla.org/1.0/firefox_versions.json")

          # Стабильный релиз (e.g. "146.0.2")
          LATEST_RELEASE=$(echo "$DETAILS" | jq -r '.LATEST_FIREFOX_VERSION')
          # Бета (e.g. "147.0b3" -> "147.0")
          LATEST_BETA_RAW=$(echo "$DETAILS" | jq -r '.LATEST_FIREFOX_RELEASED_DEVEL_VERSION')
          LATEST_BETA=$(echo "$LATEST_BETA_RAW" | sed 's/b[0-9]*//')

          echo "latest_release=$LATEST_RELEASE"     >> "$GITHUB_OUTPUT"
          echo "latest_beta=$LATEST_BETA"           >> "$GITHUB_OUTPUT"
          echo "latest_beta_raw=$LATEST_BETA_RAW"   >> "$GITHUB_OUTPUT"

          echo "Current in upstream.sh : $CURRENT_VERSION"
          echo "Latest release channel : $LATEST_RELEASE"
          echo "Latest beta channel    : $LATEST_BETA_RAW  (parsed: $LATEST_BETA)"

      - name: Compare versions and create issue if outdated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.current.outputs.version }}
          CURRENT_RELEASE: ${{ steps.current.outputs.release }}
          LATEST_RELEASE: ${{ steps.latest.outputs.latest_release }}
          LATEST_BETA: ${{ steps.latest.outputs.latest_beta }}
          LATEST_BETA_RAW: ${{ steps.latest.outputs.latest_beta_raw }}
        run: |
          # Возвращает 0 (true), если $1 > $2 по semantic versioning
          version_gt() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -1)" != "$2" ]
          }

          NEEDS_UPDATE=false

          if version_gt "$LATEST_RELEASE" "$CURRENT"; then
            NEEDS_UPDATE=true
            UPDATE_TYPE="release"
            TITLE="Upstream update: Firefox $LATEST_RELEASE (was $CURRENT)"
          elif version_gt "$LATEST_BETA" "$CURRENT"; then
            NEEDS_UPDATE=true
            UPDATE_TYPE="beta"
            TITLE="Upstream beta available: Firefox $LATEST_BETA_RAW (current $CURRENT)"
          fi

          if [ "$NEEDS_UPDATE" = "false" ]; then
            echo "Already up to date: $CURRENT"
            exit 0
          fi

          echo "Update detected: $TITLE"

          BODY="## Firefox upstream update available\n\n"
          BODY+="| | Version |\n|---|---|\n"
          BODY+="| Current (\`upstream.sh\`) | \`$CURRENT\` |\n"
          BODY+="| Latest release | \`$LATEST_RELEASE\` |\n"
          BODY+="| Latest beta | \`$LATEST_BETA_RAW\` |\n"
          BODY+="\n### Что нужно сделать\n\n"
          BODY+="1. Обновить \`upstream.sh\`: установить \`version=<new>\` и сбросить \`release=beta.1\`\n"
          BODY+="2. Перебазировать патчи на новый Firefox source\n"
          BODY+="3. Проверить C++ патчи (timezone, WebRTC, navigator)\n"
          BODY+="4. Создать тег и запустить workflow \`Build and Release\`\n"
          BODY+="\n---\n*Автоматически обнаружено $(date -u +'%Y-%m-%d %H:%M UTC')*"

          # Создать лейбл, если не существует
          gh label create "upstream-update" \
            --description "Firefox upstream version update required" \
            --color "e11d48" 2>/dev/null || true

          # Проверить, нет ли уже открытого issue
          EXISTING=$(gh issue list \
            --label "upstream-update" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open, adding comment."
            gh issue comment "$EXISTING" \
              --body "$(printf '%b' "$BODY")"
          else
            gh issue create \
              --title "$TITLE" \
              --body "$(printf '%b' "$BODY")" \
              --label "upstream-update"
            echo "Issue created."
          fi
